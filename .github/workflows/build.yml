name: Generate Web Dist

on:
  push:
    branches: [ main ] # Triggers the build automatically when you push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Change this if your project requires an older/newer Node version

    - name: Install dependencies
      run: npm install # Uses package.json to install required build tools

    - name: Build web dist
      run: node scripts/build-web.js domain # Your custom build command

    - name: Upload dist folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-dist-files
        path: dist-domain/ # Make sure this matches the exact folder name your script outputs (e.g., dist, build, or out)
