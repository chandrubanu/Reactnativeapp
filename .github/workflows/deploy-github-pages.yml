name: Deploy to GitHub Pages (chandrubanu.github.io/Reactnativeapp)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BASE_URL="/Reactnativeapp" → app.config.js sets baseUrl to /Reactnativeapp
      - name: Build web (GitHub Pages sub-path)
        env:
          BASE_URL: /Reactnativeapp
        run: npx expo export --platform web --clear

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true

