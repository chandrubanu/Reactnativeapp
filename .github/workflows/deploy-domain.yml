name: Deploy to admin.attendanceui.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # BASE_URL="" → app.config.js picks "" → baseUrl is root "/"
      - name: Build web (custom domain — root path)
        env:
          BASE_URL: ''
        run: npx expo export --platform web --output-dir dist-domain --clear

      - name: Write CNAME
        run: echo "admin.attendanceui.com" > dist-domain/CNAME

      - name: Deploy to gh-pages-domain branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-domain
          publish_branch: gh-pages-domain
          force_orphan: true

